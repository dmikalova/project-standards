# CI/CD - the one reusable workflow for every project (ADR 0006)
#
# Detects the project's languages from its files and its kind from
# mklv.config.json, then:
#   check   each language's own check, plus the shared checks
#   release svu picks the next version from Conventional Commits and
#           `project-standards changelog` writes the notes; cli projects release
#           binaries with goreleaser, everything else gets a gh release
#   deploy  cloudrun: image build, schema apply, Cloud Run deploy
#           infra:    terramate apply
#   notify  posts every main-branch result, pass or fail, to Discord #deploys,
#           with the run's warning and notice annotations (deprecations,
#           runner migrations)
#
# Scheduled runs (the standard caller runs weekly) are health checks: they
# check every project and re-apply infra projects, but release and deploy
# nothing else, and notify only on a failure or an annotation.
#
# Usage in a project's .github/workflows/cicd.yaml:
#   jobs:
#     cicd:
#       uses: dmikalova/project-standards/.github/workflows/cicd.yaml@main
#       permissions:
#         actions: read
#         checks: read
#         contents: write
#         id-token: write
#         packages: write
#       secrets: inherit

name: CI/CD

on:
  workflow_call:

# Hardcoded GCP configuration (convention over configuration)
env:
  GCP_PROJECT: mklv-infrastructure
  GCP_REGION: us-west1
  WIF_PROVIDER: projects/443065563587/locations/global/workloadIdentityPools/github/providers/github-oidc
  WIF_DEPLOY_SA: github-actions-deploy@mklv-infrastructure.iam.gserviceaccount.com
  WIF_INFRA_SA: github-actions-infra@mklv-infrastructure.iam.gserviceaccount.com
  SVU: github.com/caarlos0/svu/v3@v3.4.1
  GORELEASER: github.com/goreleaser/goreleaser/v2@v2.18.2
  PTAH_VERSION: 0.11.4
  PTAH_SHA256: de0f2d49570ed57545b50b6d4de83e5891847a79921d0ecef262467bdb38a53b

concurrency:
  group: cicd-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-26.04
    outputs:
      go: ${{ steps.detect.outputs.go }}
      deno: ${{ steps.detect.outputs.deno }}
      terraform: ${{ steps.detect.outputs.terraform }}
      terramate: ${{ steps.detect.outputs.terramate }}
      gate: ${{ steps.detect.outputs.gate }}
      kind: ${{ steps.detect.outputs.kind }}
      name: ${{ steps.detect.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Shared with the conformance bot. Referenced by full path: inside a
      # reusable workflow, ./ would resolve against the caller's repository.
      - name: Detect
        id: detect
        uses: dmikalova/project-standards/.github/actions/detect@main

  check:
    name: Check
    needs: detect
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for commit and secret scanning

      - name: Check
        uses: dmikalova/project-standards/.github/actions/check@main
        with:
          go: ${{ needs.detect.outputs.go }}
          deno: ${{ needs.detect.outputs.deno }}
          terraform: ${{ needs.detect.outputs.terraform }}
          terramate: ${{ needs.detect.outputs.terramate }}
          gate: ${{ needs.detect.outputs.gate }}
          # The commits this run introduces, for commit-message linting. A
          # force push's before is no longer in the history, so it lints the
          # default range instead.
          commit-range: ${{ github.event_name == 'push' && !github.event.forced && format('{0}..{1}', github.event.before, github.sha) || github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          npm-token: ${{ secrets.PKG_READ_TOKEN }}

  release:
    name: Release
    needs: [detect, check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for svu

      - name: Go Setup
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ needs.detect.outputs.go == 'true' && 'go.mod' || '' }}
          go-version: ${{ needs.detect.outputs.go != 'true' && 'stable' || '' }}
          cache: false # the setup action caches Go for the release tools

      - name: Setup project-standards
        uses: dmikalova/project-standards/.github/actions/setup@main
        with:
          cache-key: ${{ env.SVU }} ${{ env.GORELEASER }}

      # Every commit type releases: feat is a minor, a breaking change is a
      # major, everything else is a patch (--always). Only tags on this branch
      # count, so a tag left on rewritten history can't be picked up. A rerun
      # of an already-released commit reuses its version.
      - name: Version
        id: version
        run: |
          current=$(go run "$SVU" current --tag.mode current)
          # The previous release, or none when this is the first.
          if git rev-parse -q --verify "refs/tags/$current" >/dev/null; then
            echo "previous=$current" >> "$GITHUB_OUTPUT"
          fi
          if git tag --points-at HEAD | grep -qx "$current"; then
            echo "HEAD is already released as $current"
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          else
            next=$(go run "$SVU" next --always --tag.mode current)
            echo "Releasing $next (previous $current)"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi

      # The commit titles since the previous release, grouped by type the way
      # semantic-release did. Also posted to Discord.
      - name: Notes
        id: notes
        if: steps.version.outputs.released == 'true'
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          project-standards changelog -from "$PREVIOUS" > /tmp/notes.md
          cat /tmp/notes.md
          {
            echo "notes<<NOTES_EOF"
            cat /tmp/notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        if: steps.version.outputs.released == 'true' && needs.detect.outputs.kind != 'cli'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file /tmp/notes.md

      # goreleaser reads the version from a local tag and publishes the release
      # with the notes; GitHub creates the tag on this commit.
      - name: goreleaser Release
        if: steps.version.outputs.released == 'true' && needs.detect.outputs.kind == 'cli'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          go run "$GORELEASER" release --clean --release-notes /tmp/notes.md

  deploy-cloudrun:
    name: Deploy (Cloud Run)
    needs: [detect, release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && needs.detect.outputs.kind == 'cloudrun'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      NAME: ${{ needs.detect.outputs.name }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image Name
        id: image
        run: |
          tag="${NAME}:${VERSION#v}"
          {
            echo "local=$tag"
            echo "ghcr=ghcr.io/dmikalova/$tag"
            echo "gar=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/ghcr/dmikalova/$tag"
          } >> "$GITHUB_OUTPUT"

      # A Dockerfile controls its own image. Deno apps without one get the
      # standard two-stage distroless image.
      - name: Buildah Build
        env:
          NPM_TOKEN: ${{ secrets.PKG_READ_TOKEN }}
          IMAGE: ${{ steps.image.outputs.local }}
          DENO: ${{ needs.detect.outputs.deno }}
        run: |
          if [ -f Dockerfile ]; then
            buildah build -t "$IMAGE" .
          elif [ "$DENO" = true ]; then
            DENO_VERSION=$(cat .deno-version)
            [ -f .npmrc ] && cp .npmrc "$HOME/.npmrc"

            BUILD=$(buildah from "ghcr.io/denoland/deno:${DENO_VERSION}")
            buildah config --workingdir /app "$BUILD"
            [ -f "$HOME/.npmrc" ] && buildah copy "$BUILD" "$HOME/.npmrc" /root/.npmrc
            buildah copy "$BUILD" deno.lock deno.jsonc /app/
            buildah copy "$BUILD" src /app/src
            buildah run --env NPM_TOKEN="$NPM_TOKEN" "$BUILD" -- deno install

            ARTIFACT=$(buildah from "ghcr.io/denoland/deno:distroless-${DENO_VERSION}")
            buildah copy --from "$BUILD" "$ARTIFACT" /app /app
            buildah copy --from "$BUILD" "$ARTIFACT" /deno-dir /deno-dir
            buildah config --env DENO_DIR=/deno-dir "$ARTIFACT"
            buildah config --workingdir /app "$ARTIFACT"
            buildah config --entrypoint '["deno"]' "$ARTIFACT"
            buildah config --cmd "run --cached-only --permission-set src/main.ts" "$ARTIFACT"
            buildah commit "$ARTIFACT" "$IMAGE"
          else
            echo "::error::cloudrun projects need a Dockerfile unless they are Deno apps."
            exit 1
          fi

      - name: GHCR Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.local }}
          GHCR: ${{ steps.image.outputs.ghcr }}
        run: |
          buildah tag "$IMAGE" "$GHCR"
          buildah login -u dmikalova -p "$GITHUB_TOKEN" ghcr.io
          buildah push "$GHCR"

      - name: GCP Authn
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ env.WIF_DEPLOY_SA }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: DB Schema Setup
        id: schema
        run: |
          if [ ! -f db/schema.hcl ]; then
            echo "No db/schema.hcl, skipping schema apply"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The schema name matches the Terraform convention: dashes become
          # underscores.
          echo "schema_name=$(echo "$NAME" | tr '-' '_')" >> "$GITHUB_OUTPUT"

          tool=atlas
          if [ -f mklv.config.json ]; then
            tool=$(jq -r '.database.tool // "atlas"' mklv.config.json)
          fi
          echo "tool=${tool:-atlas}" >> "$GITHUB_OUTPUT"

          config_json=$(gcloud secrets versions access latest --secret="${NAME}-config" --project="$GCP_PROJECT")
          DATABASE_URL_SESSION=$(echo "$config_json" | jq -r '.DATABASE_URL_SESSION')
          echo "::add-mask::$DATABASE_URL_SESSION"
          echo "database_url_session=$DATABASE_URL_SESSION" >> "$GITHUB_OUTPUT"

      - name: Atlas Setup
        if: steps.schema.outputs.skip != 'true' && steps.schema.outputs.tool == 'atlas'
        uses: ariga/setup-atlas@v0

      - name: Ptah Setup
        if: steps.schema.outputs.skip != 'true' && steps.schema.outputs.tool == 'ptah'
        run: |
          archive="ptah_${PTAH_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/stokaro/ptah/releases/download/v${PTAH_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$PTAH_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ptah"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/ptah"
          # The compatibility binary accepts the existing Atlas command names.
          sudo install "$RUNNER_TEMP/ptah/ptah-compat" /usr/local/bin/atlas
          sudo install -D "$RUNNER_TEMP/ptah/LICENSE" /usr/share/licenses/ptah/LICENSE

      - name: DB Schema Apply
        if: steps.schema.outputs.skip != 'true'
        env:
          URL: ${{ steps.schema.outputs.database_url_session }}
          SCHEMA: ${{ steps.schema.outputs.schema_name }}
          TOOL: ${{ steps.schema.outputs.tool }}
        run: |
          schema_vars=()
          # --var uses CSV in both CLIs; encode the assignment before framing argv.
          if [ -f mklv.config.json ]; then
            jq -j '.database.vars // {} | to_entries[] | "--var\u0000", ([.key + "=" + .value] | @csv), "\u0000"' \
              mklv.config.json > "$RUNNER_TEMP/schema-vars"
            while IFS= read -r -d '' value; do
              schema_vars+=("$value")
            done < "$RUNNER_TEMP/schema-vars"
          fi
          dev_args=()
          case "$TOOL" in
            ptah)
              # HCL can be planned directly; use the same path for preview and apply.
              atlas schema apply --dry-run --url "$URL" \
                --to file://db/schema.hcl --schema "$SCHEMA" "${schema_vars[@]}" \
                --format '{{ sql . "  " }}' > /tmp/migration.sql
              ;;
            atlas)
              dev_args=(--dev-url "docker://postgres/15/dev?search_path=public")
              atlas schema diff --from "$URL" --to file://db/schema.hcl \
                "${dev_args[@]}" --schema "$SCHEMA" "${schema_vars[@]}" \
                --format '{{ sql . "  " }}' > /tmp/migration.sql
              ;;
            *) echo "::error::Unknown database tool: $TOOL"; exit 1 ;;
          esac

          echo "Planned changes:"
          cat /tmp/migration.sql

          if grep -qiE "DROP (TABLE|COLUMN|INDEX|CONSTRAINT)" /tmp/migration.sql; then
            echo "::error::Destructive changes detected! Apply manually with 'deno task db:apply' then push again."
            exit 1
          fi

          atlas schema apply \
            --url "$URL" \
            --to file://db/schema.hcl \
            "${dev_args[@]}" \
            --schema "$SCHEMA" \
            "${schema_vars[@]}" \
            --auto-approve

      - name: Cloud Run Deploy
        env:
          GAR: ${{ steps.image.outputs.gar }}
        run: |
          gcloud run deploy "$NAME" \
            --image "$GAR" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT" \
            --quiet

  # Runs on scheduled runs too, where release is skipped, to correct drift.
  deploy-infra:
    name: Deploy (Terramate)
    needs: [detect, check, release]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.detect.outputs.kind == 'infra' &&
      needs.check.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: ubuntu-26.04
    concurrency:
      group: terramate-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: GCP Authn
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ env.WIF_INFRA_SA }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: OpenTofu Setup
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: SOPS Setup
        run: |
          curl -fsSL -o /tmp/sops "https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64"
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops

      - name: SOPS Age Key
        run: |
          SOPS_AGE_KEY=$(gcloud secrets versions access latest --secret=sops-age-key --project="$GCP_PROJECT")
          echo "::add-mask::$(echo "$SOPS_AGE_KEY" | tail -1)"
          {
            echo "SOPS_AGE_KEY<<EOF"
            echo "$SOPS_AGE_KEY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Terramate Setup
        uses: terramate-io/terramate-action@v3

      - name: Tofu Provider Cache
        uses: actions/cache@v6
        with:
          path: ~/.tofu.d/plugin-cache
          key: tofu-providers-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tofu-providers-

      - name: Terramate Apply All Stacks
        run: |
          # The GitHub provider uses the token from SOPS, not the workflow's.
          GITHUB_TOKEN=$(sops -d --extract '["GITHUB_TOKEN"]' secrets/github.sops.json)
          export GITHUB_TOKEN
          export TF_PLUGIN_CACHE_DIR="$HOME/.tofu.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terramate script run --no-tags=manual cicd

  notify:
    name: Notify
    needs: [detect, check, release, deploy-cloudrun, deploy-infra]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: read
      id-token: write
    steps:
      - name: Annotations
        id: annotations
        uses: dmikalova/project-standards/.github/actions/annotations@main

      # Every project notifies as the deploy SA, the only one that can read the
      # webhook; infra projects also carry the mklv-deploy topic.
      - name: GCP Authn
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ env.WIF_DEPLOY_SA }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Discord
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          NAME: ${{ needs.detect.outputs.name }}
          KIND: ${{ needs.detect.outputs.kind }}
          VERSION: ${{ needs.release.outputs.version }}
          NOTES: ${{ needs.release.outputs.notes }}
          MESSAGE: ${{ github.event.head_commit.message }}
          WARNINGS: ${{ steps.annotations.outputs.text }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SCHEDULED" = true ] && [ "$FAILED" != true ] && [ -z "$WARNINGS" ]; then
            echo "Healthy scheduled run: nothing to post."
            exit 0
          fi
          webhook=$(gcloud secrets versions access latest --secret=discord-webhook-deploys --project="$GCP_PROJECT")
          echo "::add-mask::$webhook"

          subject=$(printf '%s\n' "$MESSAGE" | head -1)
          subject=${subject:-${GITHUB_SHA::7}}
          if [ "$FAILED" = true ]; then
            title="❌ ${NAME} failed"
            description=$subject
            color=15158332
          elif [ "$SCHEDULED" = true ]; then
            title="✅ ${NAME} weekly check"
            description=$subject
            color=3066993
          else
            title="✅ ${NAME} ${VERSION} (${KIND})"
            # The release notes, or the commit when nothing new was released.
            description=${NOTES:-$subject}
            color=3066993
          fi
          # Discord caps an embed description at 4096 characters.
          if [ ${#description} -gt 4000 ]; then
            description="${description:0:4000}…"
          fi

          jq -n \
            --arg title "$title" \
            --arg url "$RUN_URL" \
            --arg description "$description" \
            --argjson color "$color" \
            --arg warnings "${WARNINGS:0:4000}" \
            '{embeds: ([{title: $title, url: $url, description: $description, color: $color}]
              + if $warnings == "" then [] else
                [{title: "⚠️ Warnings and notices", url: $url, description: $warnings, color: 15844367}]
              end)}' |
            curl -fsS -H 'Content-Type: application/json' -d @- "$webhook"
