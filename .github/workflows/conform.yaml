# Conformance - weekly, unsupervised (ADR 0007)
#
# For every repo with the mklv-conform topic (never forks or archived repos):
# check it out, run `project-standards conform`, and if anything changed, run
# the project's own checks on the changed tree. project-standards itself is
# never conformed; its entry instead runs `project-standards update-actions`,
# moving its workflows and actions to their latest releases. When they pass, commit through
# the GitHub API, which signs the commit, straight to the default branch. A
# summary of the run, with its warning and notice annotations, goes to Discord
# #maintenance.
#
# All GitHub changes go through the gh CLI, authenticated with the
# infrastructure GitHub token (Secret Manager github-token). Only this
# repository's own federated identity can read it; the Discord summary uses the
# deploy SA.

name: Conformance

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      repos:
        description: Comma-separated repo names to limit the run to (default all opted-in)
        required: false
        default: ""
      dry-run:
        description: Conform and check, but don't commit
        type: boolean
        default: false

env:
  GCP_PROJECT: mklv-infrastructure
  WIF_PROVIDER: projects/443065563587/locations/global/workloadIdentityPools/github/providers/github-oidc
  WIF_DEPLOY_SA: github-actions-deploy@mklv-infrastructure.iam.gserviceaccount.com

concurrency:
  group: conform
  cancel-in-progress: false

jobs:
  list:
    name: List
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      # Direct WIF as this repository: github-token is readable only by
      # project-standards' own identity, never through a shared service account.
      - name: GCP Authn
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: List Opted-in Repos
        id: list
        env:
          ONLY: ${{ inputs.repos }}
        run: |
          GH_TOKEN=$(gcloud secrets versions access latest --secret=github-token --project="$GCP_PROJECT")
          echo "::add-mask::$GH_TOKEN"
          export GH_TOKEN

          repos=$(gh repo list dmikalova --topic mklv-conform --source --no-archived --limit 200 --json name \
            --jq '[.[].name | select(. != "project-standards")] + ["project-standards"] | sort')
          if [ -n "$ONLY" ]; then
            repos=$(jq -c --arg only "$ONLY" '($only | split(",") | map(gsub("^ +| +$"; ""))) as $o | map(select(. as $r | $o | index($r)))' <<<"$repos")
          fi
          echo "repos=$(jq -c . <<<"$repos")" | tee -a "$GITHUB_OUTPUT"

  conform:
    name: Conform ${{ matrix.repo }}
    needs: list
    if: needs.list.outputs.repos != '[]'
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJSON(needs.list.outputs.repos) }}
    steps:
      - name: GCP Authn
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Token
        id: token
        run: |
          token=$(gcloud secrets versions access latest --secret=github-token --project="$GCP_PROJECT")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: dmikalova/${{ matrix.repo }}
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0 # full history for LICENSE years, commit and secret scanning

      - name: Go Setup
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Setup project-standards
        uses: dmikalova/project-standards/.github/actions/setup@main
        with:
          # The check action caches Go for the project's own checks.
          cache: false

      - name: Conform
        id: conform
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ matrix.repo }}
        run: |
          if [ "$REPO" = project-standards ]; then
            project-standards update-actions -json | tee /tmp/report.json
          else
            project-standards conform -json | tee /tmp/report.json
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect
        id: detect
        if: steps.conform.outputs.changed == 'true'
        uses: dmikalova/project-standards/.github/actions/detect@main

      # The same checks the project's own cicd workflow runs. A project that
      # fails them is skipped and reported, never pushed.
      - name: Check
        id: check
        if: steps.conform.outputs.changed == 'true'
        uses: dmikalova/project-standards/.github/actions/check@main
        with:
          go: ${{ steps.detect.outputs.go }}
          deno: ${{ steps.detect.outputs.deno }}
          node: ${{ steps.detect.outputs.node }}
          tofu: ${{ steps.detect.outputs.tofu }}
          terramate: ${{ steps.detect.outputs.terramate }}
          gate: ${{ steps.detect.outputs.gate }}
          npm-token: ${{ secrets.PKG_READ_TOKEN }}

      # createCommitOnBranch commits are signed by GitHub, which the rulesets
      # require. expectedHeadOid makes a concurrent push fail the commit rather
      # than be overwritten.
      - name: Commit
        id: commit
        if: steps.conform.outputs.changed == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: dmikalova/${{ matrix.repo }}
        run: |
          if [ "$REPO" = dmikalova/project-standards ]; then
            headline="ci: update GitHub Actions to their latest releases"
            body=$(jq -r '.updates | map("- " + .) | join("\n")' /tmp/report.json)
          else
            headline="chore: conform to project-standards"
            body=""
          fi
          branch=$(git rev-parse --abbrev-ref HEAD)
          head=$(git rev-parse HEAD)

          additions='[]'
          deletions='[]'
          while IFS= read -r -d '' entry; do
            status=${entry:0:2}
            path=${entry:3}
            if [ "${status// /}" = D ]; then
              deletions=$(jq -c --arg p "$path" '. + [{path: $p}]' <<<"$deletions")
            else
              additions=$(jq -c --arg p "$path" --arg c "$(base64 -w0 "$path")" '. + [{path: $p, contents: $c}]' <<<"$additions")
            fi
          done < <(git status --porcelain -z --untracked-files=all)

          jq -n \
            --arg repo "$REPO" \
            --arg branch "$branch" \
            --arg head "$head" \
            --argjson additions "$additions" \
            --argjson deletions "$deletions" \
            --arg headline "$headline" \
            --arg body "$body" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: ({headline: $headline} + if $body == "" then {} else {body: $body} end),
                fileChanges: {additions: $additions, deletions: $deletions}
              }}
            }' > /tmp/commit.json

          url=$(gh api graphql --input /tmp/commit.json --jq '.data.createCommitOnBranch.commit.url')
          echo "Committed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Result
        if: always()
        env:
          REPO: ${{ matrix.repo }}
          CHANGED: ${{ steps.conform.outputs.changed }}
          CONFORM: ${{ steps.conform.outcome }}
          CHECK: ${{ steps.check.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          URL: ${{ steps.commit.outputs.url }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$CONFORM" != success ]; then status=failed
          elif [ "$CHANGED" != true ]; then status=unchanged
          elif [ "$CHECK" != success ]; then status=skipped
          elif [ "$DRY_RUN" = true ]; then status=dry-run
          elif [ "$COMMIT" = success ]; then status=pushed
          else status=failed
          fi
          findings='[]'
          [ -s /tmp/report.json ] && findings=$(jq -c '.findings // []' /tmp/report.json 2>/dev/null || echo '[]')
          mkdir -p /tmp/result
          jq -n --arg repo "$REPO" --arg status "$status" --arg url "$URL" --argjson findings "$findings" \
            '{repo: $repo, status: $status, url: $url, findings: $findings}' > "/tmp/result/$REPO.json"
          cat "/tmp/result/$REPO.json"

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.repo }}
          path: /tmp/result/${{ matrix.repo }}.json

  summary:
    name: Summary
    needs: [list, conform]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: read
      id-token: write
    steps:
      - name: Annotations
        id: annotations
        uses: dmikalova/project-standards/.github/actions/annotations@main

      - name: Download Results
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: GCP Authn
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ env.WIF_DEPLOY_SA }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - name: Discord
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LIST: ${{ needs.list.result }}
          WARNINGS: ${{ steps.annotations.outputs.text }}
        run: |
          webhook=$(gcloud secrets versions access latest --secret=discord --project="$GCP_PROJECT" | jq -r .MAINTENANCE_WEBHOOK_URL)
          echo "::add-mask::$webhook"

          if [ "$LIST" != success ]; then
            description="Listing opted-in repos failed."
            color=15158332
          else
            results=$(jq -s 'sort_by(.repo)' results/*.json 2>/dev/null || echo '[]')
            description=$(jq -r '
              def line: "• **\(.repo)**: \(.status)" + (if .url != "" then " ([commit](\(.url)))" else "" end)
                + (if (.findings | length) > 0 then "\n" + (.findings | map("  ↳ \(.path): \(.message)") | join("\n")) else "" end);
              if length == 0 then "No opted-in repos." else map(line) | join("\n") end
            ' <<<"$results")
            if jq -e 'any(.[]; .status == "failed" or .status == "skipped")' <<<"$results" >/dev/null; then
              color=15158332
            else
              color=3066993
            fi
          fi

          jq -n --arg url "$RUN_URL" --arg description "${description:0:4000}" --argjson color "$color" \
            --arg warnings "${WARNINGS:0:4000}" \
            '{embeds: ([{title: "Conformance run", url: $url, description: $description, color: $color}]
              + if $warnings == "" then [] else
                [{title: "⚠️ Warnings and notices", url: $url, description: $warnings, color: 15844367}]
              end)}' |
            curl -fsS -H 'Content-Type: application/json' -d @- "$webhook"
