# Detect a checked-out project's languages, gate and kind (ADR 0006).
#
# A project with deno.json is Deno. A project with package.json and no
# deno.json is TypeScript on Node, checked with Vite+ (ADR 0008).
#
# kind comes from mklv.config.json. Until every project declares it, it is
# inferred: a terramate root is infra, a Dockerfile or a Deno app is cloudrun,
# a Go module with cmd/ is cli, anything else is a library.

name: Detect
description: Detect a project's languages, gate, kind and name.

outputs:
  go:
    description: "true when go.mod is at the root"
    value: ${{ steps.detect.outputs.go }}
  deno:
    description: "true when deno.json or deno.jsonc is at the root"
    value: ${{ steps.detect.outputs.deno }}
  node:
    description: "true when package.json is at the root and deno.json is not"
    value: ${{ steps.detect.outputs.node }}
  tofu:
    description: "true when the project has .tf or .tofu files"
    value: ${{ steps.detect.outputs.tofu }}
  terramate:
    description: "true when terramate.tm.hcl is at the root"
    value: ${{ steps.detect.outputs.terramate }}
  gate:
    description: "ci-check, mage-check or none: how a Go project checks itself"
    value: ${{ steps.detect.outputs.gate }}
  kind:
    description: "cli, cloudrun, image, library or infra"
    value: ${{ steps.detect.outputs.kind }}
  name:
    description: "mklv.config.json name, or the repository name"
    value: ${{ steps.detect.outputs.name }}

runs:
  using: composite
  steps:
    - name: Detect
      id: detect
      shell: bash
      run: |
        go=false; [ -f go.mod ] && go=true
        deno=false; { [ -f deno.json ] || [ -f deno.jsonc ]; } && deno=true
        node=false; [ -f package.json ] && ! $deno && node=true
        tofu=false; git ls-files '*.tf' '*.tofu' | grep -q . && tofu=true
        terramate=false; [ -f terramate.tm.hcl ] && terramate=true

        # Go projects that import project-standards' ci package run ci:check.
        # Ones still on their own magefiles run `mage check` until they migrate.
        gate=none
        if $go && git ls-files 'magefile.go' 'magefiles/*.go' | grep -q .; then
          gate=mage-check
          git grep -q 'mage:import ci' -- 'magefile.go' 'magefiles/*.go' && gate=ci-check
        fi

        kind=$(jq -r '.kind // empty' mklv.config.json 2>/dev/null || true)
        if [ -z "$kind" ]; then
          if $terramate; then kind=infra
          elif [ -f Dockerfile ] || $deno; then kind=cloudrun
          elif $go && [ -d cmd ]; then kind=cli
          else kind=library
          fi
        fi

        name=$(jq -r '.name // empty' mklv.config.json 2>/dev/null || true)
        name=${name:-${GITHUB_REPOSITORY#*/}}

        {
          echo "go=$go"
          echo "deno=$deno"
          echo "node=$node"
          echo "tofu=$tofu"
          echo "terramate=$terramate"
          echo "gate=$gate"
          echo "kind=$kind"
          echo "name=$name"
        } | tee -a "$GITHUB_OUTPUT"
